<html lang="vi">
<head>

<meta name="description" content="Nhật ký lệnh, kinh nghiệm trading và câu chuyện thật từ hành trình giao dịch của Phương G63.">

<meta property="og:description" content="Hành trình thật, giao dịch thật — nhật ký lệnh, kinh nghiệm và câu chuyện từ thị trường tài chính.">

<meta property="og:image" content="https://phuongg63.com/assets/images/chien-truong-sinh-tu-poster.png">
<link rel="canonical" href="https://phuongg63.com/blog.html">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-B8KME2DB3L"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#ffd36a;--gold2:#ff9f1c;--bg:#07040b;--surface:#0f0b16;--surface2:#160f22;--muted:#6b6480;--border:rgba(255,211,106,.1)}
body{background:var(--bg);color:#e8e0f0;font-family:'Be Vietnam Pro',system-ui,sans-serif;line-height:1.6;min-height:100vh}

/* NAV */
.site-nav{position:sticky;top:0;z-index:100;background:rgba(7,4,11,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:20px;height:56px}
.nav-brand{font-size:17px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;white-space:nowrap;flex-shrink:0}
.nav-links{display:flex;gap:16px;flex:1;flex-wrap:wrap}
.nav-links a{color:rgba(255,255,255,.5);font-size:13px;text-decoration:none;transition:color .2s;white-space:nowrap}
.nav-links a:hover,.nav-links a.active{color:var(--gold);font-weight:700}
.nav-zalo{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#07040b!important;font-weight:900;padding:6px 14px;border-radius:999px;font-size:12px!important}
@media(max-width:600px){.nav-links .hide-mobile{display:none}}

/* WRAP */
.page-wrap{max-width:1200px;margin:0 auto;padding:40px 20px 80px}

/* PAGE HEADER */
.page-header{margin-bottom:36px}
.page-header h1{font-size:clamp(26px,4vw,42px);font-weight:900;color:#fff;margin-bottom:10px;line-height:1.2}
.page-header h1 span{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.page-header p{color:var(--muted);font-size:14px;max-width:480px}

/* FEATURED LABEL */
.section-label{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.section-label::before{content:'';display:block;width:4px;height:18px;background:linear-gradient(var(--gold),var(--gold2));border-radius:4px}
.section-label h2{font-size:14px;font-weight:900;color:rgba(255,211,106,.7);letter-spacing:1.5px;text-transform:uppercase}

/* ========================= */
/*  3-COL HERO               */
/* ========================= */
.hero-3col{display:grid;grid-template-columns:220px 1fr 220px;gap:18px;min-height:340px;margin-bottom:52px}
@media(max-width:960px){.hero-3col{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.hero-3col{grid-template-columns:1fr}}

/* LEFT: numbered list */
.hero-left{display:flex;flex-direction:column;gap:10px}
.h-list-item{display:flex;gap:10px;padding:11px 13px;background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:12px;text-decoration:none;color:inherit;transition:border-color .2s,background .2s;align-items:flex-start}
.h-list-item:hover{border-color:rgba(255,211,106,.25);background:rgba(255,211,106,.03)}
.h-list-num{font-size:18px;font-weight:900;color:rgba(255,211,106,.15);min-width:24px;line-height:1.1;flex-shrink:0;font-variant-numeric:tabular-nums}
.h-list-cat{font-size:9px;color:var(--gold);font-weight:800;margin-bottom:3px;letter-spacing:.8px;text-transform:uppercase}
.h-list-title{font-size:11.5px;font-weight:800;color:#e8e0f0;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:960px){.hero-left{display:none}}

/* CENTER: big card */
.hero-center{background:var(--surface2);border:1px solid var(--border);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:border-color .3s,transform .2s}
.hero-center:hover{border-color:rgba(255,211,106,.3);transform:translateY(-2px)}
.hero-center-img{width:100%;height:220px;object-fit:cover;display:block;background:var(--surface)}
.hero-center-img-ph{width:100%;height:220px;background:linear-gradient(135deg,#0f0b16,rgba(255,211,106,.06));display:flex;align-items:center;justify-content:center;font-size:56px}
.hero-center-body{padding:22px;flex:1;display:flex;flex-direction:column}
.hero-center-cat{font-size:10px;font-weight:900;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.hero-center-title{font-size:clamp(16px,2vw,21px);font-weight:900;color:#fff;line-height:1.3;margin-bottom:10px;flex:1}
.hero-center-excerpt{font-size:12.5px;color:#9d94b0;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:14px}
.hero-read-link{font-size:12px;font-weight:900;color:var(--gold);display:inline-flex;align-items:center;gap:4px}
.hero-center:hover .hero-read-link{gap:8px}

/* RIGHT: 2 stacked mini cards */
.hero-right{display:flex;flex-direction:column;gap:10px}
.h-right-card{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s;flex:1;display:flex;flex-direction:column}
.h-right-card:hover{border-color:rgba(255,211,106,.25);transform:translateY(-2px)}
.h-right-img{width:100%;height:108px;object-fit:cover;display:block;background:var(--surface2)}
.h-right-img-ph{width:100%;height:108px;display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--surface2)}
.h-right-body{padding:12px;flex:1}
.h-right-cat{font-size:9px;font-weight:900;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.h-right-title{font-size:12px;font-weight:800;color:#fff;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:600px){.hero-right{flex-direction:row}.h-right-card{flex:1}}

/* ========================= */
/*  CATEGORY SECTION         */
/* ========================= */
.cat-section{margin-bottom:48px}
.cat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.cat-title-wrap{display:flex;align-items:center;gap:10px}
.cat-icon{font-size:20px}
.cat-name{font-size:18px;font-weight:900;color:#fff}
.cat-count{font-size:10px;color:var(--muted);background:rgba(255,255,255,.05);padding:3px 9px;border-radius:999px;font-weight:700}
.cat-all{font-size:12px;font-weight:800;color:var(--gold);text-decoration:none;border:1px solid rgba(255,211,106,.2);padding:6px 14px;border-radius:999px;transition:background .2s}
.cat-all:hover{background:rgba(255,211,106,.08)}

/* SCROLL */
.scroll-wrap{position:relative}
.scroll-track{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.scroll-track::-webkit-scrollbar{height:3px}
.scroll-track::-webkit-scrollbar-track{background:rgba(255,255,255,.03);border-radius:3px}
.scroll-track::-webkit-scrollbar-thumb{background:rgba(255,211,106,.2);border-radius:3px}

/* ARTICLE CARD */
.art-card{flex:0 0 210px;background:var(--surface);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;scroll-snap-align:start;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.art-card:hover{transform:translateY(-3px);border-color:rgba(255,211,106,.25)}
.art-thumb{width:100%;height:126px;object-fit:cover;display:block;background:var(--surface2)}
.art-thumb-ph{width:100%;height:126px;display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--surface2)}
.art-body{padding:13px;flex:1;display:flex;flex-direction:column}
.art-cat{font-size:9px;font-weight:900;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.art-title{font-size:12.5px;font-weight:800;color:#fff;line-height:1.4;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.art-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.05);font-size:10px}
.art-date{color:var(--muted)}
.art-read{color:var(--gold);font-weight:900}

/* EMPTY / LOADING */
.cat-empty{color:var(--muted);font-size:13px;padding:20px 0}
.spinner-wrap{text-align:center;padding:60px 0}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid rgba(255,211,106,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* FOOTER */
.site-footer{border-top:1px solid rgba(255,255,255,.06);padding:32px 20px;text-align:center;color:var(--muted);font-size:13px;margin-top:20px}
.site-footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-brand" href="/">⚔️ Phương G63</a>
  <div class="nav-links">
    <a href="/" class="hide-mobile">Trang chủ</a>
    <a href="/#products" class="hide-mobile">Sản phẩm</a>
    <a href="/blog.html" class="active">Nhật ký</a>
    <a href="https://zalo.me/84822299993" target="_blank" class="nav-zalo">💬 Zalo</a>
  </div>
</nav>

<div class="page-wrap">

  <div class="page-header">
    <h1>Nhật Ký <span>Trading</span></h1>
    <p>Hành trình thật, giao dịch thật — những gì tôi học được từ lệnh thắng, lệnh thua và thị trường.</p>
  </div>

  <!-- LOADING -->
  <div id="loadingState" class="spinner-wrap"><div class="spinner"></div></div>

  <!-- MAIN CONTENT (hidden until loaded) -->
  <div id="mainContent" style="display:none">

    <!-- HERO 3 COL -->
    <div class="section-label"><h2>Bài Nổi Bật</h2></div>
    <div class="hero-3col" id="heroGrid">
      <!-- populated by JS -->
    </div>

    <!-- CATEGORY SECTIONS -->
    <div id="catSections">
      <!-- populated by JS -->
    </div>

  </div>

</div>

<footer class="site-footer">
  <p>© 2026 <a href="/">Phương G63</a> · Trading theo cách của mình</p>
</footer>

<script>
(function(){
  var CATS = [
    {key:'Kỹ thuật', icon:'⚔️', label:'Kỹ Thuật'},
    {key:'Tâm lý',   icon:'🧠', label:'Tâm Lý'},
    {key:'Trading',  icon:'📈', label:'Trading'},
    {key:'Kinh nghiệm', icon:'💡', label:'Kinh Nghiệm'},
    {key:'Câu chuyện',  icon:'📖', label:'Câu Chuyện'}
  ];

  function fmtDate(s){
    if(!s)return'';
    var p=s.split('-');
    if(p.length<3)return s;
    return p[2]+'/'+p[1]+'/'+p[0];
  }

  function imgEl(post, cls, phClass, phIcon){
    if(post.image && (post.image.indexOf('http')===0 || post.image.indexOf('/')===0)){
      return '<img class="'+cls+'" src="'+post.image+'" alt="'+esc(post.title)+'" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;'+phClass+'&quot;>'+phIcon+'</div>\'">';
    }
    return '<div class="'+phClass+'">'+phIcon+'</div>';
  }

  function catIcon(cat){
    var map={'Kỹ thuật':'⚔️','Tâm lý':'🧠','Trading':'📈','Kinh nghiệm':'💡','Câu chuyện':'📖'};
    return map[cat]||'📝';
  }

  function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

  function postUrl(p){return '/nhat-ky/'+p.file+'.html'}

  function buildHero(posts){
    if(!posts.length) return;
    var main=posts[0];
    var sideLeft=posts.slice(1,6);
    var sideRight=posts.slice(1,3);

    // Left list
    var leftHtml='<div class="hero-left">';
    sideLeft.forEach(function(p,i){
      leftHtml+='<a class="h-list-item" href="'+postUrl(p)+'">'
        +'<span class="h-list-num">0'+(i+1)+'</span>'
        +'<div><div class="h-list-cat">'+catIcon(p.category)+' '+esc(p.category)+'</div>'
        +'<div class="h-list-title">'+esc(p.title)+'</div></div>'
        +'</a>';
    });
    leftHtml+='</div>';

    // Center
    var centerHtml='<a class="hero-center" href="'+postUrl(main)+'">'
      +imgEl(main,'hero-center-img','hero-center-img-ph',catIcon(main.category))
      +'<div class="hero-center-body">'
      +'<div class="hero-center-cat">'+catIcon(main.category)+' '+esc(main.category)+'</div>'
      +'<div class="hero-center-title">'+esc(main.title)+'</div>'
      +(main.excerpt?'<div class="hero-center-excerpt">'+esc(main.excerpt)+'</div>':'')
      +'<div class="hero-read-link">Đọc bài này →</div>'
      +'</div></a>';

    // Right
    var rightHtml='<div class="hero-right">';
    sideRight.forEach(function(p){
      rightHtml+='<a class="h-right-card" href="'+postUrl(p)+'">'
        +imgEl(p,'h-right-img','h-right-img-ph',catIcon(p.category))
        +'<div class="h-right-body">'
        +'<div class="h-right-cat">'+catIcon(p.category)+' '+esc(p.category)+'</div>'
        +'<div class="h-right-title">'+esc(p.title)+'</div>'
        +'</div></a>';
    });
    rightHtml+='</div>';

    document.getElementById('heroGrid').innerHTML=leftHtml+centerHtml+rightHtml;
  }

  function buildCats(posts){
    var html='';
    CATS.forEach(function(cat){
      var catPosts=posts.filter(function(p){
        return (p.category||'').toLowerCase()===cat.key.toLowerCase();
      });
      if(!catPosts.length) return;
      html+='<div class="cat-section">'
        +'<div class="cat-header">'
        +'<div class="cat-title-wrap">'
        +'<span class="cat-icon">'+cat.icon+'</span>'
        +'<span class="cat-name">'+cat.label+'</span>'
        +'<span class="cat-count">'+catPosts.length+' bài</span>'
        +'</div>'
        +'<a class="cat-all" href="#">Xem tất cả →</a>'
        +'</div>'
        +'<div class="scroll-wrap"><div class="scroll-track">';
      catPosts.forEach(function(p){
        html+='<a class="art-card" href="'+postUrl(p)+'">'
          +imgEl(p,'art-thumb','art-thumb-ph',cat.icon)
          +'<div class="art-body">'
          +'<div class="art-cat">'+esc(p.category)+'</div>'
          +'<div class="art-title">'+esc(p.title)+'</div>'
          +'<div class="art-footer">'
          +'<span class="art-date">'+fmtDate(p.date)+'</span>'
          +'<span class="art-read">Đọc →</span>'
          +'</div></div></a>';
      });
      html+='</div></div></div>';
    });
    document.getElementById('catSections').innerHTML=html;
  }

  fetch('/posts.json')
    .then(function(r){return r.json();})
    .then(function(posts){
      posts.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
      buildHero(posts);
      buildCats(posts);
      document.getElementById('loadingState').style.display='none';
      document.getElementById('mainContent').style.display='block';
    })
    .catch(function(e){
      document.getElementById('loadingState').innerHTML='<p style="color:var(--muted)">Không tải được bài viết.</p>';
    });
})();
</script>
</body>
</html>
