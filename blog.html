*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{background:var(--bg);color:#fff;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh}

/* ── FILTER BAR ── */

.filter-bar{max-width:1200px;margin:0 auto;padding:10px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-right:4px}
.filter-btn{padding:6px 16px;border-radius:999px;border:1.5px solid rgba(255,211,106,.2);background:transparent;color:rgba(255,211,106,.6);font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:all .2s}

.news-layout{display:grid;grid-template-columns:1.65fr 1fr;gap:0;margin-bottom:28px;border:1px solid var(--border);border-radius:16px;overflow:hidden}

/* ── FEATURED (bài to bên trái) ── */

<script>
// ─── CONFIG ────────────────────────────────────────────────────────
const REPO       = 'phuongeag63-spec/phuongg63-website';
const BRANCH     = 'main';
const POSTS_JSON = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/posts.json`;

function fixImg(src) {
  if (!src) return '';
  src = src.trim();
  if (src.startsWith('http://') || src.startsWith('https://') || src.startsWith('/')) return src;
  return '/' + src;
}

// OLD_POSTS đã được chuyển sang posts.json — không còn dùng nữa

// ─── PARSERS ────────────────────────────────────────────────────────
function formatDate(d) {
  if (!d) return '';
  try { return new Date(d).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  catch { return d; }
}

function resultBadge(r) {
  if (!r) return '';
  if (r === 'Thắng') return `<span class="result-badge result-win">✅ Thắng</span>`;
  if (r === 'Thua')  return `<span class="result-badge result-lose">❌ Thua</span>`;
  return `<span class="result-badge result-hoa">⚖️ Hoà vốn</span>`;
}

function catIcon(cat) {
  return {'Trading':'📈','Kinh nghiệm':'💡','Câu chuyện':'📖','Nhật ký lệnh':'📊'}[cat] || '📝';
}

// ─── RENDER FEATURED ────────────────────────────────────────────────
function renderFeatured(post) {
  const img = post.image
    ? `<img class="featured-img" src="${fixImg(post.image)}" alt="${post.title}" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="featured-img-placeholder"><span class="ph-icon">${catIcon(post.category)}</span><span class="ph-label">${post.category || 'Bài viết'}</span></div>`;
  return `
  <a class="featured-card" href="${post.href}">
    ${img}
    <div class="featured-body">
      <div class="featured-meta">
        <span class="cat-badge">${post.category || 'Bài viết'}</span>
        ${resultBadge(post.result)}
        <span class="feat-new">🔥 Mới nhất</span>
        <span class="featured-date">📅 ${formatDate(post.date)}</span>
      </div>
      <h2 class="featured-title">${post.title}</h2>
      <p class="featured-excerpt">${post.excerpt || ''}</p>
      <span class="featured-read">Đọc tiếp</span>
    </div>
  </a>`;
}

// ─── RENDER SIDEBAR — text-only kiểu 24h ────────────────────────────
function renderSidebar(posts) {
  if (!posts.length) return '';
  const items = posts.slice(0, 6).map(p => `
    <a class="side-card" href="${p.href}">
      <div class="side-cat">${p.category || 'Bài viết'}</div>
      <div class="side-title">${p.title}</div>
      <div class="side-date">📅 ${formatDate(p.date)}</div>
    </a>`).join('');
  return `
  <div class="sidebar">
    <div class="sidebar-header">Bài viết gần đây</div>
    ${items}
  </div>`;
}

// ─── RENDER CARD ────────────────────────────────────────────────────
function renderCard(post) {
  const img = post.image
    ? `<img class="card-img" src="${fixImg(post.image)}" alt="${post.title}" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="card-img-placeholder"><span class="ph-icon">${catIcon(post.category)}</span><span class="ph-label">${post.category || 'Bài viết'}</span></div>`;
  return `
  <a class="post-card" href="${post.href}">
    ${img}
    <div class="card-body">
      <div class="card-meta">
        <span class="card-cat">${post.category || 'Bài viết'}</span>
        ${resultBadge(post.result)}
      </div>
      <div class="card-date">📅 ${formatDate(post.date)}</div>
      <h3>${post.title}</h3>
      <p>${post.excerpt || ''}</p>
      <div class="card-read">Đọc bài →</div>
    </div>
  </a>`;
}

// ─── PAGINATION ─────────────────────────────────────────────────────
const POSTS_PER_PAGE = 13;
let currentPage = 1;
let searchQuery  = '';

function renderPagination(page, total) {
  const el = document.getElementById('pagination');
  if (!el) return;
  if (total <= 1) { el.innerHTML = ''; return; }

  let html = `<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>← Trước</button>`;

  // Tính danh sách trang hiển thị
  const pages = [];
  if (total <= 7) {
    for (let i = 1; i <= total; i++) pages.push(i);
  } else {
    pages.push(1);
    if (page > 3) pages.push('...');
    for (let i = Math.max(2, page-1); i <= Math.min(total-1, page+1); i++) pages.push(i);
    if (page < total - 2) pages.push('...');
    pages.push(total);
  }

  pages.forEach(p => {
    if (p === '...') {
      html += `<span class="page-dots">…</span>`;
    } else {
      html += `<button class="page-btn${p===page?' active':''}" onclick="goPage(${p})">${p}</button>`;
    }
  });

  html += `<button class="page-btn" onclick="goPage(${page+1})" ${page===total?'disabled':''}>Tiếp →</button>`;
  el.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  renderAll();
  // Cuộn lên đầu danh sách
  const el = document.getElementById('newsLayout') || document.querySelector('.header-bar');
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

// ─── RENDER ALL ─────────────────────────────────────────────────────
let allPosts    = [];
let activeFilter = 'all';

function renderAll() {
  // 1. Lọc theo category
  let filtered = activeFilter === 'all'
    ? allPosts
    : allPosts.filter(p => p.category === activeFilter);

  // 2. Lọc theo search
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(p =>
      p.title.toLowerCase().includes(q) ||
      (p.excerpt || '').toLowerCase().includes(q)
    );
  }

  const layout      = document.getElementById('newsLayout');
  const moreSection = document.getElementById('moreSection');
  const grid        = document.getElementById('postsGrid');
  const sectionLbl  = moreSection ? moreSection.querySelector('.section-label') : null;

  if (!filtered.length) {
    layout.style.display = 'grid';
    layout.innerHTML = `<div class="status-msg" style="grid-column:1/-1"><div class="icon">🔍</div><div>Không tìm thấy bài viết nào.</div></div>`;
    moreSection.style.display = 'none';
    renderPagination(0, 0);
    return;
  }

  // 3. Tính trang
  const totalPages = Math.ceil(filtered.length / POSTS_PER_PAGE);
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  const start     = (currentPage - 1) * POSTS_PER_PAGE;
  const pagePosts = filtered.slice(start, start + POSTS_PER_PAGE);

  if (currentPage === 1) {
    // Trang 1: featured + sidebar + grid
    layout.style.display = 'grid';
    const [featured, ...rest] = pagePosts;
    layout.innerHTML = renderFeatured(featured) + renderSidebar(rest);
    const gridPosts = rest.slice(6); // sidebar dùng 6 bài
    if (gridPosts.length) {
      moreSection.style.display = 'block';
      if (sectionLbl) sectionLbl.style.display = '';
      grid.innerHTML = gridPosts.map(renderCard).join('');
    } else {
      moreSection.style.display = 'none';
    }
  } else {
    // Trang 2+: chỉ hiện grid
    layout.style.display = 'none';
    moreSection.style.display = 'block';
    if (sectionLbl) sectionLbl.style.display = 'none';
    grid.innerHTML = pagePosts.map(renderCard).join('');
  }

  renderPagination(currentPage, totalPages);
}

function setFilter(cat) {
  activeFilter = cat;
  currentPage  = 1;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.filter-btn').forEach(b => {
    if (b.textContent.includes(cat === 'all' ? 'Tất cả' : cat)) b.classList.add('active');
  });
  renderAll();
}

function setSearch(val) {
  searchQuery = val.trim();
  currentPage = 1;
  renderAll();
}

// ─── LOAD POSTS ──────────────────────────────────────────────────────
async function loadMarkdownPosts() {
  try {
    const res = await fetch(POSTS_JSON + '?t=' + Date.now());
    if (!res.ok) throw new Error('posts.json not found');
    const posts = await res.json();
    return posts.map(p => ({
      title:    p.title    || p.file,
      date:     p.date     || '',
      category: p.category || 'Bài viết',
      result:   p.result   || null,
      image:    p.image    || null,
      excerpt:  p.excerpt  || '',
      href:     `/nhat-ky/post.html?file=${encodeURIComponent(p.file)}`,
      _ts:      p.date     || p.file,
    }));
  } catch(e) {
    console.warn('Could not fetch posts.json:', e);
    return [];
  }
}

// ─── INIT ───────────────────────────────────────────────────────────
(async () => {
  const mdPosts = await loadMarkdownPosts();
  allPosts = [...mdPosts].sort((a,b) =>
    new Date(b.date || b._ts || '2000') - new Date(a.date || a._ts || '2000')
  );

  if (!allPosts.length) {
    document.getElementById('newsLayout').innerHTML =
      `<div class="status-msg" style="grid-column:1/-1"><div class="icon">📭</div><div>Chưa có bài viết nào.</div></div>`;
    return;
  }
  renderAll();
})();
</script>
