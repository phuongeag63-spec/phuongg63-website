<script>
// ─── CONFIG ─────────────────────────────────────────────────────────────
const REPO   = 'phuongeag63-spec/phuongg63-website';
const BRANCH = 'main';
const RAW    = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/nhat-ky/`;

// ─── READING PROGRESS ───────────────────────────────────────────────────
window.addEventListener('scroll', () => {
  const el = document.getElementById('progress-bar');
  const total = document.body.scrollHeight - window.innerHeight;
  const pct = total > 0 ? (window.scrollY / total) * 100 : 0;
  el.style.width = pct + '%';
});

// ─── PARSE FRONTMATTER ──────────────────────────────────────────────────
function parseFrontmatter(text) {
  const match = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
  if (!match) return { meta: {}, body: text };
  const meta = {};
  match[1].split('\n').forEach(line => {
    const col = line.indexOf(':');
    if (col < 0) return;
    const key = line.slice(0, col).trim();
    let val = line.slice(col + 1).trim().replace(/^["']|["']$/g, '');
    meta[key] = val;
  });
  return { meta, body: match[2] };
}

// ─── FORMAT DATE ────────────────────────────────────────────────────────
function formatDate(str) {
  if (!str) return '';
  const d = new Date(str);
  return d.toLocaleDateString('vi-VN', { day:'numeric', month:'long', year:'numeric' });
}

// ─── ESTIMATE READ TIME ─────────────────────────────────────────────────
function readTime(text) {
  const words = text.trim().split(/\s+/).length;
  const mins = Math.ceil(words / 200);
  return `${mins} phút đọc`;
}

// ─── UPDATE META TAGS ───────────────────────────────────────────────────
function updateMeta(title, description, image, url, date) {
  document.title = `${title} | Phương G63`;
  const setMeta = (sel, val) => { const el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
  const setLink = (sel, val) => { const el = document.querySelector(sel); if (el) el.setAttribute('href', val); };

  setMeta('meta[name="description"]', description);
  setMeta('meta[property="og:title"]', title + ' | Phương G63');
  setMeta('meta[property="og:description"]', description);
  setMeta('meta[property="og:url"]', url);
  setMeta('meta[property="og:image"]', image || 'https://phuongg63.com/assets/images/chien-truong-sinh-tu-poster.png');
  setMeta('meta[name="twitter:title"]', title + ' | Phương G63');
  setMeta('meta[name="twitter:description"]', description);
  setMeta('meta[name="twitter:image"]', image || 'https://phuongg63.com/assets/images/chien-truong-sinh-tu-poster.png');
  setLink('link[rel="canonical"]', url);

  // ✅ Schema markup — BlogPosting
  const schema = {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": title,
    "description": description,
    "url": url,
    "datePublished": date || new Date().toISOString().slice(0,10),
    "dateModified": date || new Date().toISOString().slice(0,10),
    "author": {
      "@type": "Person",
      "name": "Phương G63",
      "url": "https://phuongg63.com/"
    },
    "publisher": {
      "@type": "Person",
      "name": "Phương G63",
      "url": "https://phuongg63.com/"
    },
    "image": image ? `https://phuongg63.com${image.startsWith('/') ? '' : '/'}${image}` : "https://phuongg63.com/assets/images/chien-truong-sinh-tu-poster.png",
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": url
    }
  };
  const existing = document.getElementById('schema-ld');
  if (existing) existing.remove();
  const script = document.createElement('script');
  script.id = 'schema-ld';
  script.type = 'application/ld+json';
  script.textContent = JSON.stringify(schema);
  document.head.appendChild(script);
}

// ─── UPDATE HERO ────────────────────────────────────────────────────────
function updateHero(image, title) {
  const hero = document.getElementById('heroWrap');
  if (image) {
    const absImg = image.startsWith('http') ? image : `https://phuongg63.com${image}`;
    hero.innerHTML = `<img src="${absImg}" alt="${title}" onerror="this.parentElement.innerHTML='<div class=hero-placeholder>📝</div>'">
      <div class="hero-overlay"></div>`;
  }
}

// ─── RENDER ARTICLE ─────────────────────────────────────────────────────
function renderArticle(meta, body, fileName) {
  const title = meta.title || fileName;
  const description = meta.description || body.slice(0, 160).replace(/[#*\n]/g,'').trim() + '...';

  // Update SEO
  updateMeta(title, description, image, pageUrl, date);
  updateHero(image, title);

  // ✅ GA — track page view với tiêu đề đúng
  if (typeof gtag !== 'undefined') {
    gtag('event', 'page_view', { page_title: title, page_location: pageUrl });
  }

  // Render markdown
  marked.setOptions({ breaks: true, gfm: true });
  const html = marked.parse(body);

    <div class="internal-cta">

        <div class="internal-cta-title">Muốn có <span>EA MT5 riêng</span> chạy tự động 24/7?</div>
        <div class="internal-cta-desc">Biến chiến lược của bạn thành robot trading — không cần ngồi màn hình, không bỏ lỡ lệnh nào. Trader thật lập trình, hiểu thị trường.</div>
        <a class="internal-cta-btn" href="/lap-trinh-ea.html">🔧 Xem dịch vụ lập trình EA →</a>
      </div>
    </div>

    <div class="signature">— Phương G63 —</div>

    <div class="share-section">
      <div class="share-label">Chia sẻ bài viết</div>
      <div class="share-btns">
        <a class="share-btn share-fb" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </a>
        <a class="share-btn share-zalo" href="https://zalo.me/84822299993" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.03 2 11c0 2.76 1.3 5.22 3.34 6.9L4 22l4.22-1.37C9.35 21.19 10.65 21.5 12 21.5c5.52 0 10-4.03 10-9S17.52 2 12 2z"/></svg>
          Chia sẻ Zalo
        </a>
        <button class="share-btn share-copy" onclick="copyLink(this)" data-url="${pageUrl}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy link
        </button>
      </div>
    </div>

    <div class="author-card">
      <div class="author-avatar-placeholder">👤</div>
      <div class="author-info">
        <h4>Phương G63</h4>
        <p>Trader & lập trình viên EA MT5 tại Việt Nam. Chia sẻ kinh nghiệm thật từ hành trình trading — không tô vẽ, không bịa đặt.</p>
      </div>
    </div>

    <div class="bottom-nav">
      <a class="btn-outline" href="/blog.html">← Xem tất cả bài viết</a>
      <a class="btn-outline" href="/">🏠 Trang chủ</a>
    </div>
  `;
}

// ─── COPY LINK ──────────────────────────────────────────────────────────
function copyLink(btn) {
  const url = btn.dataset.url || window.location.href;
  navigator.clipboard.writeText(url).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Đã copy!`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy link`;
    }, 2000);
  });
}

// ─── RELATED POSTS ──────────────────────────────────────────────────────
async function loadRelatedPosts(currentFile, currentCategory) {
  try {
    const API = `https://api.github.com/repos/${REPO}/contents/nhat-ky?ref=${BRANCH}`;
    const res = await fetch(API);
    if (!res.ok) return;
    const files = await res.json();
    const mdFiles = files
      .filter(f => f.name.endsWith('.md') && !f.name.includes(currentFile))
      .sort(() => Math.random() - 0.5);

    // Lấy tối đa 6 file để chọn bài cùng category
    const candidates = mdFiles.slice(0, 6);
    const posts = [];

    for (const f of candidates) {
      if (posts.length >= 3) break;
      try {
        const r = await fetch(RAW + f.name);
        const text = await r.text();
        const { meta } = parseFrontmatter(text);
        posts.push({
          title:    meta.title || f.name.replace('.md',''),
          date:     meta.date ? meta.date.slice(0,10) : '',
          category: meta.category || 'Bài viết',
          image:    meta.image || null,
          href:     `/nhat-ky/post.html?file=${encodeURIComponent(f.name.replace('.md',''))}`,
        });
      } catch { /* skip */ }
    }

    if (!posts.length) return;

    const grid = document.getElementById('relatedGrid');
    grid.innerHTML = posts.map(p => `
      <a class="related-card" href="${p.href}">
        ${p.image
          ? `<img class="related-img" src="https://phuongg63.com${p.image}" alt="${p.title}" loading="lazy" onerror="this.outerHTML='<div class=related-img-ph>📝</div>'">`
          : `<div class="related-img-ph">📝</div>`}
        <div class="related-body">
          <div class="related-cat">${p.category}</div>
          <div class="related-card-title">${p.title}</div>
          ${p.date ? `<div class="related-date">📅 ${formatDate(p.date)}</div>` : ''}
        </div>
      </a>`).join('');

    document.getElementById('relatedSection').style.display = 'block';
  } catch(e) { /* silently fail */ }
}

// ─── MAIN ───────────────────────────────────────────────────────────────
(async () => {
  const params = new URLSearchParams(window.location.search);
  const file = params.get('file');

  if (!file) {
    document.getElementById('articleContent').innerHTML = `
      <div class="error-box">
        <div class="icon">🔍</div>
        <h2>Không tìm thấy bài viết</h2>
        <p>Vui lòng quay lại trang blog để chọn bài.</p>
        <a class="btn-back" href="/blog.html">← Quay lại Blog</a>
      </div>`;
    return;
  }

  try {
    const url = RAW + encodeURIComponent(file) + '.md';
    const res = await fetch(url);
    if (!res.ok) throw new Error('Not found');
    const text = await res.text();
    const { meta, body } = parseFrontmatter(text);
    renderArticle(meta, body, file);
    // Load bài viết liên quan sau khi render xong (không chặn)
    loadRelatedPosts(file, meta.category || '');
  } catch (e) {
    document.getElementById('articleContent').innerHTML = `
      <div class="error-box">
        <div class="icon">😕</div>
        <h2>Không tải được bài viết</h2>
        <p>Bài viết có thể đã bị xóa hoặc đường dẫn không đúng.</p>
        <a class="btn-back" href="/blog.html">← Quay lại Blog</a>
      </div>`;
  }
})();
</script>
